# === PostgreSQL ===
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres_language_learning
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# === Liquibase ===
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/liquibase/changelog.xml
spring.liquibase.clear-checksums=true

# === Swagger ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
server.port=8080

# === Logs ===
logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# === JWT ===
jwt.secret=your-super-secret-jwt-key-that-should-be-at-least-256-bits-long
jwt.expiration=86400000

# === OpenAI ===
openai.apiKey=${OPENAI_API_KEY}
openai.apiUrl=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o
